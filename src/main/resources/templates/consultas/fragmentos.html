<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

    <head th:replace="~{general/plantilla :: head}"></head>

    <body>

        <section th:fragment="tabs" class="py-3 mb-4">
            <div class="d-flex justify-content-center px-5"> 
                <ul class="nav nav-underline">
                    <li class="nav-item">
                        <a th:href="@{/}" class="nav-link" aria-current="page">
                            [[#{consultas.todas}]]
                        </a>
                    </li>
                    <li th:each="c : ${categorias}" class="nav-item">
                        <a th:href="@{/consultas/{id}(id=${c.idCategoria})}" class="nav-link">
                            [[${c.descripcion}]]
                        </a>
                    </li>
                </ul>
            </div>
        </section>


        <section th:fragment="tarjetas" class="container py-4">
            <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-4 g-4">

                <div th:each="p : ${productos}" class="col">
                    <div class="card h-100 shadow-sm">

                        <div class="d-flex justify-content-center align-items-center bg-light p-3" style="height:200px;">
                            <img th:src="${p.rutaImagen}" 
                                 th:alt="${p.descripcion}" 
                                 class="img-fluid"
                                 style="max-height:100%;object-fit:contain;">
                        </div>

                        <div class="card-header bg-white">
                            <h5 class="card-title text-center text-truncate mb-0"
                                th:text="${p.descripcion}">
                            </h5>
                        </div>

                        <div class="card-body d-flex flex-column">
                            <p class="card-text text-muted mb-auto text-truncate"
                               th:text="${p.detalle}">
                            </p>
                        </div>

                        <div class="card-footer bg-white d-flex justify-content-between align-items-center">

                            <div class="fw-bold">
                                <span class="text-success h5"
                                      th:text="${#numbers.formatCurrency(p.precio)}"></span>

                                <span th:if="${p.existencias > 0}"
                                      class="badge text-bg-success ms-2"
                                      th:text="${p.existencias + ' unidades'}">
                                </span>

                                <span th:unless="${p.existencias > 0}"
                                      class="badge text-bg-danger ms-2">
                                    Agotado
                                </span>
                            </div>

                            <form th:action="@{/carrito/agregar}" method="POST">
                                <input type="hidden"
                                       name="idProducto"
                                       th:value="${p.idProducto}">

                                    <button type ="button"
                                            class="btn btn-sm btn-primary"
                                            type="submit"
                                            th:disabled="${p.existencias == 0}"
                                            onclick="addCart(this.form)">
                                        <i class="fas fa-cart-plus"></i>
                                    </button>
                            </form>

                        </div>
                    </div>
                </div>

            </div>
        </section>


        <section th:fragment='consultas' class='row row-cols-4 p-2'>

            <div th:replace="~{consultas/fragmentos :: formConsulta('primary',#{consultas.derivadas},'/consultas/consultaDerivada')}"></div>

            <div th:replace="~{consultas/fragmentos :: formConsulta('warning',#{consultas.jpql},'/consultas/consultaJPQL')}"></div>

            <div th:replace="~{consultas/fragmentos :: formConsulta('success',#{consultas.sql},'/consultas/consultaSQL')}"></div>


            <div class="card p-2">

                <div class="card-header text-center text-white bg-danger">
                    <h5>Práctica #2 - Buscar Producto</h5>
                </div>

                <div class="card-body">

                    <form method="post" th:action="@{/consultas/buscarProducto}" class="mb-3">

                        <label>Buscar producto</label>

                        <input type="text"
                               name="texto"
                               th:value="${texto}"
                               class="form-control"
                               placeholder="Digite el nombre del producto"
                               required>

                            <div class="text-center mt-2">
                                <button type="submit" class="btn btn-danger">
                                    🔍 Buscar
                                </button>
                            </div>

                    </form>

                    <div class="table-responsive">

                        <table class="table table-bordered table-sm">

                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Producto</th>
                                    <th>Categoría</th>
                                    <th>Precio</th>
                                    <th>Existencias</th>
                                    <th>Stock</th>
                                </tr>
                            </thead>

                            <tbody>

                                <tr th:each="p : ${productos}">
                                    <td th:text="${p.idProducto}"></td>
                                    <td th:text="${p.descripcion}"></td>
                                    <td th:text="${p.categoria.descripcion}"></td>
                                    <td th:text="${p.precio}"></td>
                                    <td th:text="${p.existencias}"></td>
                                    <td th:text="${p.existencias > 0} ? 'Disponible' : 'Agotado'"></td>
                                </tr>

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>


        </section>


        <div th:fragment='formConsulta(colorForm, textoForm, urlForm)'>

            <form method="post" th:action='@{${urlForm}}' class='was-validated'>

                <div class='card p-2'>

                    <div class="card-header text-center text-white"
                         th:classappend="${'bg-'+colorForm}">
                        <h5>[[${textoForm}]]</h5>
                    </div>

                    <div class="card-body">

                        <div class='mb-3'>
                            <label>[[#{consultas.precio.inferior}]]</label>
                            <input type="number"
                                   name='precioInf'
                                   th:value='${precioInf}'
                                   class='form-control'
                                   min="0"
                                   required>
                        </div>

                        <div class='mb-3'>
                            <label>[[#{consultas.precio.superior}]]</label>
                            <input type="number"
                                   name='precioSup'
                                   th:value='${precioSup}'
                                   class='form-control'
                                   min="0"
                                   required>
                        </div>

                    </div>

                    <div class="card-footer text-center">

                        <button type='submit'
                                class='btn text-white'
                                th:classappend="${'btn-'+colorForm}">
                            <i class='fa-solid fa-magnifying-glass'></i>
                            [[${textoForm}]]
                        </button>

                    </div>

                </div>

            </form>

        </div>

    </body>
</html>
